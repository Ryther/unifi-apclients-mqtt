name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate when called by the release workflow
        type: string
        required: false
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check GitHub Actions workflows
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history and working tree
        run: |
          image='ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f' # v8.30.1
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$image" detect --source /repo --redact --no-banner
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$image" detect --no-git --source /repo --redact --no-banner

  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.90.0", "1.98.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: Start disposable MQTT broker and run Rust checks
        env:
          MQTT_TEST_BROKER: 127.0.0.1:1883
          RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          docker run --detach --rm --name mqtt-contract-broker --publish 1883:1883 \
            --volume "$GITHUB_WORKSPACE/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
          trap 'docker stop mqtt-contract-broker >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in $(seq 1 15); do
            : "$attempt"
            if docker exec mqtt-contract-broker mosquitto_pub -h 127.0.0.1 -t health -m ready >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs mqtt-contract-broker
            exit 1
          fi
          cargo "+$RUST_TOOLCHAIN" fmt --all -- --check
          cargo "+$RUST_TOOLCHAIN" clippy --locked --all-targets --all-features -- -D warnings
          cargo "+$RUST_TOOLCHAIN" test --locked

  container:
    name: Docker image
    runs-on: ubuntu-24.04
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build the exact candidate image
        run: |
          docker build --tag unifi-apclients-mqtt:test .
          mkdir -p "$RUNNER_TEMP/unifi-security"
          docker save --output "$RUNNER_TEMP/unifi-security/image.tar" unifi-apclients-mqtt:test
      - name: Verify the standalone runtime starts
        run: |
          set +e
          output=$(docker run --rm --network none unifi-apclients-mqtt:test 2>&1)
          runtime_exit_code=$?
          set -e
          if [ "$runtime_exit_code" -ne 1 ] || [[ "$output" != *'Missing("UNIFI_URL")'* ]]; then
            echo "$output" >&2
            exit 1
          fi
      - name: Scan the candidate image and Cargo lockfile
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/unifi-security:/scan" \
            --workdir /scan "$TRIVY_IMAGE" image \
            --cache-dir /scan/cache --scanners vuln --severity HIGH,CRITICAL \
            --format sarif --output /scan/image.sarif --input /scan/image.tar
          docker run --rm \
            --volume "$RUNNER_TEMP/unifi-security:/scan" \
            --volume "$GITHUB_WORKSPACE/Cargo.lock:/repo/Cargo.lock:ro" \
            --workdir /repo "$TRIVY_IMAGE" fs \
            --cache-dir /scan/cache --scanners vuln --pkg-types library \
            --severity HIGH,CRITICAL --format sarif \
            --output /scan/rust-dependencies.sarif /repo
      - name: Preserve security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-sarif
          path: |
            ${{ runner.temp }}/unifi-security/image.sarif
            ${{ runner.temp }}/unifi-security/rust-dependencies.sarif
          if-no-files-found: error
          retention-days: 7
      - name: Reject fixable high and critical vulnerabilities
        run: |
          status=0
          docker run --rm \
            --volume "$RUNNER_TEMP/unifi-security:/scan" \
            --workdir /scan "$TRIVY_IMAGE" image \
            --cache-dir /scan/cache --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --input /scan/image.tar || status=1
          docker run --rm \
            --volume "$RUNNER_TEMP/unifi-security:/scan" \
            --volume "$GITHUB_WORKSPACE/Cargo.lock:/repo/Cargo.lock:ro" \
            --workdir /repo "$TRIVY_IMAGE" fs \
            --cache-dir /scan/cache --scanners vuln --pkg-types library \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            /repo || status=1
          exit "$status"

  security-results:
    name: Trivy Code Scanning
    if: >-
      always() && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      inputs.ref == '' &&
      github.event.repository.private == false
    needs: container
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-sarif
          path: security
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security/image.sarif
          category: container-image
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security/rust-dependencies.sarif
          category: rust-dependencies
