name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests with disposable MQTT broker
        env:
          MQTT_TEST_BROKER: 127.0.0.1:1883
        run: |
          docker run --detach --rm --name mqtt-contract-broker --publish 1883:1883 \
            --volume "$GITHUB_WORKSPACE/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2
          trap 'docker stop mqtt-contract-broker >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 15); do
            if docker exec mqtt-contract-broker mosquitto_pub -h 127.0.0.1 -t health -m ready >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          cargo test --locked

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag unifi-apclients-mqtt:test .
