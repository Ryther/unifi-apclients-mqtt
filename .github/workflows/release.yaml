name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft Release Please tag to validate and resume (for example unifi-apclients-mqtt-v0.2.0)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: unifi-apclients-mqtt-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.resume.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.resume.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release automation token
        if: github.event_name == 'push'
        id: token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo '::notice::Release Please is paused until RELEASE_PLEASE_TOKEN is configured; see docs/releasing.md.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Maintain the release pull request or create a draft release
        if: github.event_name == 'push' && steps.token.outputs.configured == 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resume an existing draft release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        id: resume
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^unifi-apclients-mqtt-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'release_tag must use unifi-apclients-mqtt-vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  verify-draft:
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      # GitHub only exposes draft releases to tokens with push access.
      contents: write
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      release_id: ${{ steps.identity.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm this is the matching draft release and capture its commit
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | {id: .id, tagName: .tag_name, isDraft: .draft, targetCommitish: .target_commitish}')
          test -n "$release"
          test "$(jq -r .tagName <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .isDraft <<<"$release")" = true
          candidate_sha=$(jq -r .targetCommitish <<<"$release")
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$candidate_sha^{commit}"
          git merge-base --is-ancestor "$candidate_sha" "$GITHUB_SHA"
          git checkout --detach "$candidate_sha"
          head_sha=$(git rev-parse HEAD)
          test "$candidate_sha" = "$head_sha"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r .id <<<"$release")" >> "$GITHUB_OUTPUT"

  validate-candidate:
    needs: [prepare, verify-draft]
    if: needs.prepare.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ needs.verify-draft.outputs.sha }}

  validate-commit:
    needs: [prepare, verify-draft]
    if: needs.prepare.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/commits.yaml
    with:
      ref: ${{ needs.verify-draft.outputs.sha }}

  publish-image:
    needs: [prepare, verify-draft, validate-candidate, validate-commit]
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-draft.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ryther/unifi-apclients-mqtt:${{ needs.prepare.outputs.tag_name }}
            ghcr.io/ryther/unifi-apclients-mqtt:latest

  publish-release:
    needs: [prepare, verify-draft, publish-image]
    if: needs.prepare.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft after its image is available
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify-draft.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --field draft=false
