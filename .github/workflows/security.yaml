name: Published image security

on:
  schedule:
    - cron: '37 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-image:
    name: Trivy published image and Cargo lockfile
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the published image
        run: |
          mkdir -p "$RUNNER_TEMP/unifi-security"
          docker pull ghcr.io/ryther/unifi-apclients-mqtt:latest
          docker save --output "$RUNNER_TEMP/unifi-security/image.tar" \
            ghcr.io/ryther/unifi-apclients-mqtt:latest
      - name: Scan the published image and current Cargo lockfile
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/unifi-security:/scan" \
            --workdir /scan "$TRIVY_IMAGE" image \
            --cache-dir /scan/cache --scanners vuln --severity HIGH,CRITICAL \
            --format sarif --output /scan/image.sarif --input /scan/image.tar
          docker run --rm \
            --volume "$RUNNER_TEMP/unifi-security:/scan" \
            --volume "$GITHUB_WORKSPACE/Cargo.lock:/repo/Cargo.lock:ro" \
            --workdir /repo "$TRIVY_IMAGE" fs \
            --cache-dir /scan/cache --scanners vuln --pkg-types library \
            --severity HIGH,CRITICAL --format sarif \
            --output /scan/rust-dependencies.sarif /repo
          mkdir -p security
          cp "$RUNNER_TEMP/unifi-security/image.sarif" security/image.sarif
          cp "$RUNNER_TEMP/unifi-security/rust-dependencies.sarif" security/rust-dependencies.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security/image.sarif
          category: container-image
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security/rust-dependencies.sarif
          category: rust-dependencies
      - name: Reject newly fixable high and critical vulnerabilities
        run: |
          status=0
          docker run --rm \
            --volume "$RUNNER_TEMP/unifi-security:/scan" \
            --workdir /scan "$TRIVY_IMAGE" image \
            --cache-dir /scan/cache --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --input /scan/image.tar || status=1
          docker run --rm \
            --volume "$RUNNER_TEMP/unifi-security:/scan" \
            --volume "$GITHUB_WORKSPACE/Cargo.lock:/repo/Cargo.lock:ro" \
            --workdir /repo "$TRIVY_IMAGE" fs \
            --cache-dir /scan/cache --scanners vuln --pkg-types library \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            /repo || status=1
          exit "$status"
