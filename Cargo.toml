[package]
name = "unifi-apclients-mqtt"
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
description = "Publish UniFi access point client snapshots to MQTT for Home Assistant"
license = "MIT"

[lib]
name = "unifi_apclients_mqtt"
path = "src/lib.rs"

[[bin]]
name = "unifi-apclients-mqtt"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
rumqttc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
serde_json = "1"
